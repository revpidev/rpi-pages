# Cloudflare Pages project for the revpi.dev product endpoints (ADR-0009).
#
# 部署方式：Cloudflare Pages Git 集成（GitHub revpidev/rpi-pages，push 到
# main 自动部署，PR 自动 preview）——见 README「生成 + 部署」。
# 本地预览/调试：
#   npx wrangler pages dev .
# 兜底手动部署（会覆盖 Git 集成部署，仅调试用，勿用于日常发版）：
#   npx wrangler pages deploy . --project-name=revpi --branch main
#
# Optional: install-count telemetry recording (functions/api/report-install.js
# writes into this KV namespace when bound):
#   npx wrangler kv namespace create ANALYTICS
# then paste the returned id below and redeploy.

name = "revpi"
compatibility_date = "2025-01-01"
account_id = "677ab7398364b1f673e2cf06d0a59b19"

# [[kv_namespaces]]
# binding = "ANALYTICS"
# id = "<paste namespace id here>"

# GitHub Release 资产镜像（functions/releases/download/[[path]].js）：
# 单资产约 30MB，超 Pages 25MiB 静态资产上限，故放 R2。
# 对象 key = `v<version>/<filename>`，由 scripts/mirror-release.sh 上传。
# 一次性初始化：
#   npx wrangler r2 bucket create rpi-releases
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "rpi-releases"
